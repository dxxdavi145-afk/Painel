
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Stretch Gamer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b13;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    max-width: 420px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #00eaff;
    font-size: 27px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
}

.card {
    background: #121a29;
    border: 1px solid #24364b;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 12px;
    font-weight: bold;
}

.preview {
    width: 100%;
    height: 190px;
    background: #05080e;
    border: 2px solid #00eaff;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.screen {
    width: 70%;
    height: 85%;
    background: linear-gradient(135deg,#123d70,#00c8d9);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: bold;
    transform-origin: center;
    transition: transform .3s;
}

input[type=range] {
    width: 100%;
    accent-color: #00eaff;
    margin: 15px 0;
}

.value {
    text-align: center;
    color: #00eaff;
    font-size: 22px;
    font-weight: bold;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
    background: #00cce8;
    color: #001018;
    font-weight: bold;
    font-size: 16px;
}

button.off {
    background: #263448;
    color: white;
}

.status {
    text-align: center;
    color: #00eaff;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>SCREEN STRETCH</h1>
<p class="subtitle">Painel de ajuste de tela gamer</p>

<div class="card">
    <label>PRÉ-VISUALIZAÇÃO</label>

    <div class="preview">
        <div class="screen" id="screen">
            TELA GAMER
        </div>
    </div>

    <p class="status" id="status">Esticamento desativado</p>
</div>

<div class="card">
    <label>LARGURA DA TELA</label>

    <div class="value">
        <span id="number">100</span>%
    </div>

    <input
        type="range"
        id="width"
        min="70"
        max="150"
        value="100"
        oninput="updateScreen()"
    >

    <label>ALTURA DA VISUALIZAÇÃO</label>

    <input
        type="range"
        id="height"
        min="70"
        max="120"
        value="100"
        oninput="updateScreen()"
    >

    <button onclick="activate()">
        ATIVAR ESTICAMENTO
    </button>

    <button class="off" onclick="resetScreen()">
        RESTAURAR PADRÃO
    </button>
</div>

<div class="card">
    <label>INFORMAÇÕES</label>
    <p>Modo: <span id="mode">Padrão</span></p>
    <p>Largura: <span id="widthInfo">100%</span></p>
    <p>Altura: <span id="heightInfo">100%</span></p>
</div>

</div>

<script>
const screen = document.getElementById("screen");
const widthInput = document.getElementById("width");
const heightInput = document.getElementById("height");

let active = false;

function updateScreen() {
    const w = widthInput.value;
    const h = heightInput.value;

    document.getElementById("number").textContent = w;
    document.getElementById("widthInfo").textContent = w + "%";
    document.getElementById("heightInfo").textContent = h + "%";

    if (active) {
        applyStretch();
    }
}

function applyStretch() {
    const w = widthInput.value / 100;
    const h = heightInput.value / 100;

    screen.style.transform =
        `scale(${w}, ${h})`;
}

function activate() {
    active = true;
    applyStretch();

    document.getElementById("status").textContent =
        "Esticamento ativado na pré-visualização";

    document.getElementById("mode").textContent =
        "Personalizado";
}

function resetScreen() {
    active = false;

    widthInput.value = 100;
    heightInput.value = 100;

    screen.style.transform = "scale(1, 1)";

    document.getElementById("number").textContent = "100";
    document.getElementById("widthInfo").textContent = "100%";
    document.getElementById("heightInfo").textContent = "100%";
    document.getElementById("status").textContent =
        "Esticamento desativado";
    document.getElementById("mode").textContent = "Padrão";
}
</script>

</body>
</html>
